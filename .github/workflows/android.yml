
name: Android

# This workflow is triggered on pushes to the repository.

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - main

jobs:
  build:
    # This job will run on ubuntu virtual machine
    runs-on: ubuntu-latest
    steps:

      # Setup Java environment in order to build the Android app.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v1
        with:
          java-version: '22'

      # Setup the flutter environment.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0' # you can also specify exact version of flutter
          # channel: 'beta' # 'dev', 'alpha', default to: 'stable'
          # flutter-version: '1.12.x' # you can also specify exact version of flutter

      # Get flutter dependencies.
      - run: flutter pub cache clean
      - run: flutter channel stable
      - run: flutter pub get

      - run: |
          touch .env
          echo ROOTSTOCK_NODE=${{ secrets.ROOTSTOCK_NODE }} >> .env
          echo BLOCK_EXPLORER_URL=${{ secrets.BLOCK_EXPLORER_URL }} >> .env
          echo BTC_BLOCK_EXPLORER_URL=https://mempool.space/testnet >> .env
          echo SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} >> .env
          echo SENTRY_DSN=${{ secrets.SENTRY_DSN }} >> .env
          echo PRIVATE_KEY=${{ secrets.PRIVATE_KEY }} >> .env
          echo MOCK_TRANSACTIONS=true >> .env
          echo TOKENS='[{"tokenId":"1", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tRif", "symbol2":"tRif", "address":"0x19F64674D8A5B4E652319F5e239eFd3bc969A1fE", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23" }, { "tokenId":"2", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tUSDRif", "symbol2":"tUSDRif", "address":"0x8dbf326e12a9fF37ED6DDF75adA548C2640A6482", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23" }, { "tokenId":"3", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tDOC", "symbol2":"tDOC", "address":"0xCB46c0ddc60D18eFEB0E586C17Af6ea36452Dae0", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23" }, { "tokenId":"4", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tRIFPRO", "symbol2":"tRIFPRO", "address":"0x23A1aA7b11e68beBE560a36beC04D1f79357f28d", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23"},{"tokenId":"5", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tBRZ", "symbol2":"tBRZ", "address":"0x369197080bAcFFf3147eC2F59076168F45f5b75d", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23"}]' >> .env
          echo TRANSACTIONS='[ { "transactionId": "1", "amountInWeis": "1000", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "1.000", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "2", "amountInWeis": "1050", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "315,55", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "2", "amountInWeis": "1000", "ddateTime": "01/05/1984", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "0", "amountInWeis": 100000000000000, "ddateTime": "01/05/1985", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "3", "amountInWeis": "1000000", "ddateTime": "01/05/1986", "walletId": "1", "valueInUsdFormatted": "500,00", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "4", "amountInWeis": "1000", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "1.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "5", "amountInWeis": "1000", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "5", "amountInWeis": "10020", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "7", "amountInWeis": "10030", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "8", "amountInWeis": "10040", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "9", "amountInWeis": "10050", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "10", "amountInWeis": "10060", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "11", "amountInWeis": "105", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" } ]' >> .env
          echo TRIF="0x19F64674D8A5B4E652319F5e239eFd3bc969A1fE" >> .env
          echo USDRIF="0x8dbf326e12a9fF37ED6DDF75adA548C2640A6482" >> .env
          echo DOC="0xCB46c0ddc60D18eFEB0E586C17Af6ea36452Dae0" >> .env
          echo RIFPRO="0x23A1aA7b11e68beBE560a36beC04D1f79357f28d" >> .env
          echo LANCEN="0x9afc95c5c1A3d79cCf4c9af2e291f0134Aa403Df" >> .env
          cat .env

      # Statically analyze the Dart code for any errors. Info/warning-level
      # lint issues are reported but don't fail the build (only real errors
      # do) - see docs/linux-web-support-plan.md for why this was added.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings .

      # Run widget tests for our flutter project.
      - run: flutter test

      # Build apk.
      - run: flutter build apk

      # Upload generated apk to the artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/apk/release/maniva-release.apk

  release:
    name: Release APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from build
        uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: ${{ github.event.repository.name }} v${{ github.run_number }}
      - name: Upload Release APK
        id: upload_release_asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./maniva-release-${{ github.run_number }}.apk
          asset_name: maniva-release-${{ github.run_number }}.apk
          asset_content_type: application/zip