name: Linux Build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev clang cmake libgl1-mesa-dev libglu1-mesa-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test --no-pub

      - name: Build Linux app (release)
        run: flutter build linux --release

      - name: Show build output (debug)
        run: ls -la build/linux/x64/release/bundle || true

      - name: Archive Linux bundle
        run: |
          mkdir -p build/artifacts
          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            tar -czf build/artifacts/linux-app.tar.gz -C "$BUNDLE_DIR" .
            echo "Packaged $BUNDLE_DIR -> build/artifacts/linux-app.tar.gz"
          else
            echo "Warning: $BUNDLE_DIR not found"
            exit 1
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/artifacts/linux-app.tar.gz
