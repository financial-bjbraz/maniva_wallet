name: Linux Build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev: sentry_flutter's Linux native build (sentry-native,
          # vendored via CMake FetchContent) requires libcurl's dev headers -
          # without it, CMake configure fails with "Could NOT find CURL".
          # ruby/rubygems: needed to install fpm, which packages the .deb/.rpm below.
          sudo apt-get install -y libgtk-3-dev clang cmake libgl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev ruby ruby-dev rubygems build-essential rpm

      - name: Install fpm
        # fpm ("effing package management") packages a plain directory into
        # .deb and .rpm from the same input - no separate Ubuntu/RHEL build
        # environment needed, since the Flutter Linux bundle itself is the
        # same binary either way (it only depends on GTK3/glib, present on
        # both).
        run: sudo gem install --no-document fpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: '3.35.0' # you can also specify exact version of flutter
      # Get flutter dependencies.
      - run: flutter pub cache clean
      - run: flutter channel stable
      - run: flutter pub get

      - run: |
          touch .env
          echo ROOTSTOCK_NODE=${{ secrets.ROOTSTOCK_NODE }} >> .env
          echo BITCOIN_NODE=https://bitcoin-testnet-rpc.publicnode.com >> .env
          echo BITCOIN_ESPLORA_URL=https://mempool.space/testnet/api >> .env
          echo BLOCK_EXPLORER_URL=${{ secrets.BLOCK_EXPLORER_URL }} >> .env
          echo MOCK_TRANSACTIONS=true >> .env
          echo TOKENS='[{"tokenId":"1", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tRif", "symbol2":"tRif", "address":"0x19F64674D8A5B4E652319F5e239eFd3bc969A1fE", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23" }, { "tokenId":"2", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tUSDRif", "symbol2":"tUSDRif", "address":"0x8dbf326e12a9fF37ED6DDF75adA548C2640A6482", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23" }, { "tokenId":"3", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tDOC", "symbol2":"tDOC", "address":"0xCB46c0ddc60D18eFEB0E586C17Af6ea36452Dae0", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23" }, { "tokenId":"4", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tRIFPRO", "symbol2":"tRIFPRO", "address":"0x23A1aA7b11e68beBE560a36beC04D1f79357f28d", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23"},{"tokenId":"5", "network":"31", "networkName":"Rootstock Testnet", "symbol":"tBRZ", "symbol2":"tBRZ", "address":"0x369197080bAcFFf3147eC2F59076168F45f5b75d", "nodeUrl":"https://go.getblock.io/1eced638ecbd41e797744989aac22a23"}]' >> .env
          echo TRANSACTIONS='[ { "transactionId": "1", "amountInWeis": "1000", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "1.000", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "2", "amountInWeis": "1050", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "315,55", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "2", "amountInWeis": "1000", "ddateTime": "01/05/1984", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "0", "amountInWeis": 100000000000000, "ddateTime": "01/05/1985", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "3", "amountInWeis": "1000000", "ddateTime": "01/05/1986", "walletId": "1", "valueInUsdFormatted": "500,00", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "4", "amountInWeis": "1000", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "1.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "5", "amountInWeis": "1000", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "5", "amountInWeis": "10020", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "7", "amountInWeis": "10030", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "8", "amountInWeis": "10040", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "9", "amountInWeis": "10050", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "10", "amountInWeis": "10060", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" }, { "transactionId": "11", "amountInWeis": "105", "ddateTime": "01/05/1983", "walletId": "1", "valueInUsdFormatted": "0.005", "valueInWeiFormatted": "100000000000000", "status": "STATUS", "type": 0, "destination": "DESTINATION" } ]' >> .env
          echo TRIF="0x19F64674D8A5B4E652319F5e239eFd3bc969A1fE" >> .env
          echo USDRIF="0x8dbf326e12a9fF37ED6DDF75adA548C2640A6482" >> .env
          echo DOC="0xCB46c0ddc60D18eFEB0E586C17Af6ea36452Dae0" >> .env
          echo RIFPRO="0x23A1aA7b11e68beBE560a36beC04D1f79357f28d" >> .env
          echo LANCEN="0x9afc95c5c1A3d79cCf4c9af2e291f0134Aa403Df" >> .env
          cat .env

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings .
      - run: flutter test
      # RELEASE_NAME (shown in Settings > About) is only non-empty when this
      # run was triggered by an actual published GitHub Release - passed via
      # env, not interpolated directly into the shell command, since
      # github.event.release.name is untrusted user input.
      - name: Build Linux app (release)
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
        run: flutter build linux --release --dart-define=RELEASE_NAME="$RELEASE_NAME"

      - name: Show build output (debug)
        run: ls -la build/linux/x64/release/bundle || true

      - name: Archive Linux bundle
        run: |
          mkdir -p build/artifacts
          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            tar -czf build/artifacts/${{ github.run_number }}-maniva-app.tar.gz -C "$BUNDLE_DIR" .
            echo "Packaged $BUNDLE_DIR -> build/artifacts/${{ github.run_number }}-maniva-app.tar.gz"
          else
            echo "Warning: $BUNDLE_DIR not found"
            exit 1
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/artifacts/${{ github.run_number }}-maniva-app.tar.gz

      # Same Flutter Linux bundle, wrapped as .deb (Ubuntu/Debian) and .rpm
      # (RHEL/Fedora) with fpm from one shared staging directory - the
      # bundle only depends on GTK3/glib, present on both families, so no
      # separate per-distro build is needed. Installs to /opt (side-by-side
      # with other vendor apps) with a /usr/bin launcher and a desktop
      # entry, matching normal Linux packaging conventions.
      - name: Package .deb and .rpm
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          BUNDLE_DIR="build/linux/x64/release/bundle"
          PKG_ROOT="build/pkgroot"
          APP_DIR="$PKG_ROOT/opt/maniva-wallet"

          mkdir -p "$APP_DIR" "$PKG_ROOT/usr/bin" "$PKG_ROOT/usr/share/applications" \
            "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE_DIR"/. "$APP_DIR/"

          cat > "$PKG_ROOT/usr/bin/maniva-wallet" <<'EOF'
          #!/bin/sh
          exec /opt/maniva-wallet/my_rootstock_wallet "$@"
          EOF
          chmod +x "$PKG_ROOT/usr/bin/maniva-wallet"

          cp assets/images/maniva_logo.png \
            "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/maniva-wallet.png"

          cat > "$PKG_ROOT/usr/share/applications/maniva-wallet.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Maniva Wallet
          Comment=Bitcoin and Rootstock wallet
          Exec=/usr/bin/maniva-wallet
          Icon=maniva-wallet
          Categories=Finance;
          Terminal=false
          EOF

          mkdir -p build/artifacts
          fpm -s dir -t deb -n maniva-wallet -v "$VERSION" \
            --description "Bitcoin and Rootstock wallet" \
            --license "See repository" \
            -p "build/artifacts/${{ github.run_number }}-maniva-wallet.deb" \
            -C "$PKG_ROOT" usr opt

          fpm -s dir -t rpm -n maniva-wallet -v "$VERSION" \
            --description "Bitcoin and Rootstock wallet" \
            --license "See repository" \
            -p "build/artifacts/${{ github.run_number }}-maniva-wallet.rpm" \
            -C "$PKG_ROOT" usr opt

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/artifacts/${{ github.run_number }}-maniva-wallet.deb

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: build/artifacts/${{ github.run_number }}-maniva-wallet.rpm

      # Only on an actual GitHub Release being published (not on every push
      # or manual dispatch) - attaches all 3 Linux packaging formats.
      - name: Upload Linux builds to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/artifacts/${{ github.run_number }}-maniva-app.tar.gz
            build/artifacts/${{ github.run_number }}-maniva-wallet.deb
            build/artifacts/${{ github.run_number }}-maniva-wallet.rpm
